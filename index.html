<style>
:root{
  --paper:#F3D5B2; --paper-d:#E7C39A; --ink:#4A2A1A; --maroon:#7A1828; --gold:#A8741F; --gold-l:#C99A45;
  --cw:min(100vw, 56.28svh); --ch:calc(var(--cw) / .5628);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper-d)}
body{background:radial-gradient(ellipse at 50% 30%, #F1D3AE, #E2BC92 75%) fixed;color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden;height:100svh}
.rz{font-family:'Rozha One',serif;font-weight:400}.hi{font-family:'Tiro Devanagari Hindi',serif}.it{font-style:italic}
.mc{font-family:'Marcellus',serif;letter-spacing:.2em;text-transform:uppercase}

/* ---------- a page = one painted card, centred on paper ---------- */
.pg{position:relative;height:100svh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%, #F1D3AE, #E2BC92 75%)}
.card{position:relative;width:var(--cw);height:var(--ch);overflow:hidden;box-shadow:0 0 0 1px rgba(168,116,31,.18),0 24px 60px rgba(90,45,15,.28);transform-origin:50% 40%}
.card > .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  -webkit-mask-image:radial-gradient(ellipse 75% 62% at 50% 34%, #000 var(--b,120%), transparent calc(var(--b,120%) + 34%));
          mask-image:radial-gradient(ellipse 75% 62% at 50% 34%, #000 var(--b,120%), transparent calc(var(--b,120%) + 34%))}
.card > .base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:multiply;background-image:var(--noise)}
/* text in the empty lower third of each painting */
.txt{position:absolute;left:11%;right:11%;top:61.5%;bottom:9%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.full{position:absolute;left:10%;right:10%;top:9%;bottom:9%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2}
.k{font-size:calc(var(--cw)*.036);color:var(--gold);letter-spacing:.02em}
.k.mc{font-size:calc(var(--cw)*.026)}
.t{text-wrap:balance;font-size:calc(var(--cw)*.098);line-height:1.12;color:var(--maroon);margin-top:calc(var(--cw)*.012)}
.t.sm{font-size:calc(var(--cw)*.078)}
.e{text-wrap:balance;font-size:calc(var(--cw)*.046);color:var(--ink);margin-top:calc(var(--cw)*.006)}
.time{display:inline-block;margin-top:calc(var(--cw)*.028);padding:calc(var(--cw)*.014) calc(var(--cw)*.04);border-top:1px solid var(--gold-l);border-bottom:1px solid var(--gold-l);font-size:calc(var(--cw)*.038);color:var(--maroon)}
.p{text-wrap:balance;font-size:calc(var(--cw)*.04);line-height:1.75;color:var(--ink)}
.p b{font-weight:400;color:var(--maroon)}
.pe{font-size:calc(var(--cw)*.043);line-height:1.45;color:var(--ink)}
.orn{width:calc(var(--cw)*.34);height:calc(var(--cw)*.05);margin:calc(var(--cw)*.03) auto;display:block}
.w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px)}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:calc(var(--cw)*.03);padding:calc(var(--cw)*.026) calc(var(--cw)*.06);border-radius:40px;background:var(--maroon);color:#FBEBD2;font-family:'Marcellus';letter-spacing:.16em;text-transform:uppercase;font-size:calc(var(--cw)*.028);text-decoration:none;border:0;cursor:pointer;box-shadow:0 6px 16px rgba(90,20,30,.25)}
.btn.o{background:transparent;color:var(--maroon);border:1px solid var(--maroon);box-shadow:none}

/* ---------- gate: envelope ---------- */
#gate{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%, #F1D3AE, #E2BC92 75%)}
#gate .card{display:flex;align-items:center;justify-content:center}
.gtop{position:absolute;top:12%;left:0;right:0;text-align:center;z-index:3}
.gbot{position:absolute;bottom:11%;left:0;right:0;text-align:center;z-index:3}
.env{position:relative;width:calc(var(--cw)*.72);height:calc(var(--cw)*.5);perspective:calc(var(--cw)*2);z-index:2;cursor:pointer;margin-top:calc(var(--cw)*.06)}
.env .back{position:absolute;inset:0;background:linear-gradient(160deg,#8A1D2B,#6E1220);border-radius:6px;box-shadow:0 18px 40px rgba(80,20,20,.35)}
.env .letter{position:absolute;left:6%;right:6%;top:7%;height:86%;border-radius:4px;overflow:hidden;background:#F3D5B2 url(assets/img/mandap.webp) 50% 18%/cover;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.env .pocket{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,#9E2434,#7C1726);clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%);box-shadow:inset 0 0 0 2px rgba(214,170,90,.45)}
.env .pocket::before{content:"";position:absolute;inset:7px;border:1px solid rgba(232,190,110,.55);border-radius:4px;clip-path:polygon(0 0,50% 52%,100% 0,100% 100%,0 100%)}
.env .flap{position:absolute;left:0;right:0;top:0;height:62%;background:linear-gradient(180deg,#A82B3C,#8A1D2B);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;z-index:3;backface-visibility:hidden}
.env .seal{position:absolute;left:50%;top:52%;width:calc(var(--cw)*.17);height:calc(var(--cw)*.17);margin:calc(var(--cw)*-.085) 0 0 calc(var(--cw)*-.085);border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 30%,#E9C26B,#B8862E 55%,#7A5413);box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,240,200,.35);display:flex;align-items:center;justify-content:center;color:#5A2A0A;font-family:'Rozha One';font-size:calc(var(--cw)*.05)}
.tap{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}

/* ---------- date tiles ---------- */
.tiles{display:flex;gap:calc(var(--cw)*.03);margin-top:calc(var(--cw)*.05);perspective:600px}
.tile{width:calc(var(--cw)*.22);height:calc(var(--cw)*.26);position:relative;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.3,.7,.2,1)}
.tile .f,.tile .bk{position:absolute;inset:0;border-radius:10px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--gold-l);background:rgba(255,246,230,.55)}
.tile .bk{transform:rotateY(180deg);background:var(--maroon);color:#FBEBD2;border-color:var(--maroon)}
.tile .q{font-size:calc(var(--cw)*.09);color:var(--gold)}
.tile .l{font-size:calc(var(--cw)*.026);color:var(--gold);margin-top:4px}
.tile.on{transform:rotateY(180deg)}
.tile .bk .v{font-size:calc(var(--cw)*.075);line-height:1.1}
.tile .bk .v.s{font-size:calc(var(--cw)*.05)}

/* form */
form{width:100%;display:flex;flex-direction:column;gap:calc(var(--cw)*.025);text-align:left;margin-top:calc(var(--cw)*.03)}
form label{font-family:'Marcellus';letter-spacing:.14em;text-transform:uppercase;font-size:calc(var(--cw)*.024);color:var(--gold)}
form input,form select{width:100%;margin-top:4px;padding:calc(var(--cw)*.022);border-radius:10px;border:1px solid var(--gold-l);background:rgba(255,248,236,.7);color:var(--ink);font-family:'Cormorant Garamond';font-size:calc(var(--cw)*.042)}
.ch{display:flex;gap:8px;margin-top:4px}.ch label{flex:1;text-align:center;padding:calc(var(--cw)*.022) 4px;border:1px solid var(--gold-l);border-radius:10px;cursor:pointer;font-family:'Tiro';text-transform:none;letter-spacing:0;font-size:calc(var(--cw)*.036);color:var(--maroon)}
.ch input{display:none}.ch label:has(input:checked){background:var(--maroon);color:#FBEBD2;border-color:var(--maroon)}
form .btn{align-self:center}
.names span{white-space:nowrap}

/* ambience */
.petal{position:fixed;top:-20px;z-index:150;pointer-events:none;border-radius:70% 0 70% 0;opacity:.85;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-20px) rotate(0)}100%{transform:translate(var(--dx),105vh) rotate(var(--r))}}
.dust{position:absolute;z-index:1;width:4px;height:4px;border-radius:50%;background:#FFE7A8;box-shadow:0 0 8px 3px rgba(255,214,120,.6);opacity:0;animation:rise ease-in-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(0)}25%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),-120px)}}
#music{position:fixed;z-index:190;right:max(12px,calc(50vw - var(--cw)/2 + 12px));bottom:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold-l);background:rgba(122,24,40,.88);color:#FBEBD2;display:none;align-items:center;justify-content:center;cursor:pointer}
#music svg{width:18px;height:18px}#music.on rect{animation:eq 1s ease-in-out infinite}#music rect:nth-child(2){animation-delay:.2s}#music rect:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.35)}}#music rect{transform-origin:50% 100%;transform-box:fill-box}
.cue{position:absolute;bottom:3.2%;left:0;right:0;text-align:center;z-index:3;font-size:calc(var(--cw)*.024);color:var(--gold)}
@media (prefers-reduced-motion:reduce){.w{opacity:1;transform:none;filter:none}.petal,.dust{display:none}}
</style>
</head>

<script>
/* ===================== DETAILS ===================== */
const C={
  rsvpWhatsApp:"",                       // family number with country code, e.g. "919812345678"
  weddingISO:"2026-11-27T19:00:00+05:30",
  venueQuery:"Shree Mohan Garden, Burari, New Delhi 110084",
  darshan:["श्री जगत सिंह मनराल","श्री श्याम सिंह मनराल","श्री कुबेर सिंह मनराल","श्री शिवराज सिंह मनराल","श्री हीरा सिंह मनराल","श्री गोपाल सिंह मनराल","श्री बलवन्त सिंह मनराल","श्री रघुवीर सिंह मनराल","श्री राजेन्द्र सिंह मनराल"]
};
const ORN='<svg class="orn"><use href="#orn"/></svg>';
const D1='पहला दिन · बृहस्पतिवार, 26 नवम्बर', D2='दूसरा दिन · शुक्रवार, 27 नवम्बर', D3='तीसरा दिन · शनिवार, 28 नवम्बर';
const scene=(img,k,t,e,time,opt={})=>({img,html:`<div class="txt">
  <div class="hi k w">${k}</div>
  <div class="rz t ${opt.sm?'sm':''} w">${t}</div>
  <div class="it e w">${e}</div>
  ${time?`<div class="hi time w">${time}</div>`:''}${opt.extra||''}</div>`,dust:opt.dust});
const card=(html)=>({img:null,html:`<div class="full">${html}</div>`});

const PAGES=[
 scene('mandap','॥ श्री गणेशाय नमः ॥','आरती <span class="hi" style="font-size:.42em;color:var(--gold)">संग</span> राकेश','Aarti &amp; Rakesh','26 – 28 नवम्बर 2026 · नई दिल्ली',{dust:true,extra:'<div class="cue mc w" style="position:static;margin-top:calc(var(--cw)*.03)">Scroll ↓</div>'}),
 card(`<div class="hi k w">॥ वक्रतुण्ड महाकाय ॥</div>
   <p class="hi p w" style="color:var(--gold);margin-top:6px">वक्रतुण्ड महाकाय सूर्यकोटि समप्रभ ।<br>निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा ॥</p>${ORN}
   <p class="hi p w">परमपिता परमेश्वर एवं पितृदेवों की असीम अनुकम्पा से</p>
   <div class="rz w" style="font-size:calc(var(--cw)*.062);color:var(--maroon);line-height:1.25;margin:calc(var(--cw)*.02) 0">श्रीमती कुसुम देवी मनराल<br>एवं श्री भगवत सिंह मनराल</div>
   <p class="hi p w">अपनी प्रिय सुपुत्री के शुभ विवाह पर<br>आपको सादर आमंत्रित करते हैं</p>${ORN}
   <p class="it pe w">With the blessings of the Almighty and our ancestors, Smt. Kusum Devi Manral &amp; Shri Bhagwat Singh Manral invite you to the wedding of their beloved daughter</p>`),
 scene('couple','मनराल एवं बिष्ट परिवार','आयु. आरती <span class="hi" style="font-size:.5em;color:var(--gold)">संग</span> चि. राकेश','के परिणय सूत्र बंधन की मधुर व पावन बेला पर','',{sm:true}),
 card(`<div class="hi k w">परिणय सूत्र बंधन</div>${ORN}
   <div class="rz t sm w">आयु. आरती</div>
   <p class="hi p w">सुपुत्री – श्रीमती कुसुम देवी एवं<br>श्री भगवत सिंह मनराल</p>
   <p class="hi p w" style="font-size:calc(var(--cw)*.034);opacity:.8">सुपौत्री – स्व. श्रीमती सरस्वती देवी एवं स्व. श्री मान सिंह मनराल जी<br>मूल निवासी – जिला अल्मोड़ा, उत्तराखण्ड</p>
   <div class="hi w" style="font-size:calc(var(--cw)*.05);color:var(--gold);margin:calc(var(--cw)*.03) 0">— संग —</div>
   <div class="rz t sm w">चि. राकेश</div>
   <p class="hi p w">सुपुत्र – स्व. श्रीमती विमला देवी एवं<br>श्री जगत सिंह बिष्ट</p>
   <p class="hi p w" style="font-size:calc(var(--cw)*.034);opacity:.8">निवासी – शास्त्री पार्क एक्सटेंशन, बुराड़ी, दिल्ली – 110084</p>`),
 card(`<div class="hi k w">शुभ मुहूर्त</div>
   <div class="rz t sm w">शुभ विवाह की तिथि</div>
   <div class="tiles w" id="tiles">
     <div class="tile"><div class="f"><div class="rz q">?</div><div class="hi l">दिन</div></div><div class="bk"><div class="rz v">27</div><div class="hi l" style="color:#F2D49A">शुक्रवार</div></div></div>
     <div class="tile"><div class="f"><div class="rz q">?</div><div class="hi l">माह</div></div><div class="bk"><div class="rz v s">नवम्बर</div><div class="mc l" style="color:#F2D49A">November</div></div></div>
     <div class="tile"><div class="f"><div class="rz q">?</div><div class="hi l">वर्ष</div></div><div class="bk"><div class="rz v s">2026</div><div class="hi l" style="color:#F2D49A">ईस्वी</div></div></div>
   </div>
   <button class="btn w" id="reveal" style="margin-top:calc(var(--cw)*.06)">तिथि देखें · Reveal</button>
   <p class="it pe w" style="margin-top:calc(var(--cw)*.04)">Three days of celebrations · 26 – 28 November</p>`),
 scene('haldi',D1,'गणेश पूजा व शुभ हल्दी','Ganesh Puja &amp; Haldi','प्रातः 8:00 बजे · 8:00 AM',{sm:true}),
 scene('suwal',D1,'सुवाल पथाई','Suwal Pathai · a Kumaoni tradition','दोपहर 2:00 बजे · 2:00 PM'),
 scene('sangeet',D1,'महिला संगीत','Ladies Sangeet','दोपहर 3:00 बजे · 3:00 PM'),
 scene('katha',D1,'श्री सत्यनारायण कथा','Satyanarayan Katha','सायं 6:00 बजे · 6:00 PM',{sm:true}),
 scene('mehendi',D1,'मेंहदी भरे हाथ','Mehendi','सायं 7:00 बजे · प्रीतिभोज रात्रि 9:00 बजे'),
 scene('baraat',D2,'बारात स्वागत','Baraat Swagat','रात्रि 7:00 बजे · प्रीतिभोज रात्रि 8:00 बजे',{dust:true}),
 scene('pheras',D2,'शुभ विवाह','The Pheras · seven sacred vows','शुभ लग्नानुसार',{dust:true}),
 scene('vidai',D3,'विदाई','बाबुल के आँगन से पिया के घर','प्रातः बेला · Morning'),
 scene('venue','॥ विवाह स्थल ॥','श्री मोहन गार्डन','Near Burari Public School, Sunil Colony Road, Burari, New Delhi – 110084','',{extra:'<a class="btn w" id="dirBtn" target="_blank" rel="noopener">Get directions</a>'}),
 card(`<div class="hi k w">कृपया पधारें</div>
   <div class="rz t sm w">आपकी प्रतीक्षा रहेगी</div>
   <p class="it pe w">Kindly let us know if you can join us</p>
   <form id="rsvp" class="w">
     <label>Your name<input name="name" id="rsvpName" required placeholder="Full name"></label>
     <label>Will you attend?<div class="ch"><label><input type="radio" name="att" value="Yes, we will attend 🙏" checked><span>हाँ, ज़रूर</span></label><label><input type="radio" name="att" value="Sorry, we can't make it"><span>क्षमा करें</span></label></div></label>
     <label>Guests<select name="n"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option><option>6+</option></select></label>
     <button class="btn" type="submit">Send RSVP on WhatsApp</button>
   </form>
   <a class="btn o w" id="calBtn" target="_blank" rel="noopener">Add to calendar</a>`),
 card(`<div class="hi k w">दर्शनाभिलाषी</div>
   <p class="hi p names w" id="darshan" style="font-size:calc(var(--cw)*.036);margin-top:6px"></p>${ORN}
   <div class="hi k w">विनीत</div>
   <p class="hi p w">श्री भगवत सिंह मनराल<br>एवं समस्त सम्बंधी एवं मित्रगण</p>${ORN}
   <p class="hi p w" style="color:var(--maroon)">हल्दी है, चन्दन है, रिश्तों का बन्धन है,<br>हमारी दीदी की शादी में आपका अभिनन्दन है ।</p>
   <div class="rz w" style="font-size:calc(var(--cw)*.05);color:var(--gold)">अंकित एवं आराध्या</div>`),
 card(`<div class="hi k w">॥ शुभ विवाह ॥</div>
   <div class="rz w" style="font-size:calc(var(--cw)*.15);color:var(--maroon);line-height:1.05;margin-top:calc(var(--cw)*.03)">आरती</div>
   <div class="hi w" style="font-size:calc(var(--cw)*.05);color:var(--gold)">संग</div>
   <div class="rz w" style="font-size:calc(var(--cw)*.15);color:var(--maroon);line-height:1.05">राकेश</div>${ORN}
   <p class="hi p w">आपके आशीर्वाद की प्रतीक्षा में</p>
   <div class="hi w" style="font-size:calc(var(--cw)*.046);color:var(--gold);margin-top:6px">मनराल एवं बिष्ट परिवार</div>
   <p class="it pe w" style="margin-top:calc(var(--cw)*.03)">26 – 28 November 2026 · New Delhi</p>`)
];

/* ===================== BUILD ===================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
document.documentElement.style.setProperty('--noise',`url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .15  0 0 0 .8 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>')}")`);
$('#book').innerHTML=PAGES.map((p,i)=>`<section class="pg" style="z-index:${i+1}"><div class="card">
  ${p.img?`<img class="base" src="assets/img/card.webp" alt=""><img class="art" src="assets/img/${p.img}.webp" alt="" ${i>1?'loading="lazy"':''}>`:`<img class="base" src="assets/img/card.webp" alt="">`}
  ${p.dust?'<div class="dusts"></div>':''}${p.html}</div></section>`).join('');
// split headline/body lines into words for a soft word-by-word rise (Devanagari kept whole per word)
$$('.w').forEach(el=>{ if(el.children.length||el.tagName==='FORM'||el.classList.contains('tiles')||el.tagName==='A'||el.tagName==='BUTTON') return;
  const parts=el.innerHTML.split(/(<br>)/); el.innerHTML=parts.map(s=>s==='<br>'?s:s.split(' ').filter(Boolean).map(x=>`<span class="w2" style="display:inline-block">${x}</span>`).join(' ')).join(''); });
// gold dust in lamp-lit scenes
$$('.dusts').forEach(d=>{ for(let i=0;i<14;i++){const s=document.createElement('i');s.className='dust';s.style.left=(15+Math.random()*70)+'%';s.style.top=(18+Math.random()*38)+'%';s.style.setProperty('--dx',(Math.random()*40-20)+'px');s.style.animationDuration=(3+Math.random()*4)+'s';s.style.animationDelay=(-Math.random()*6)+'s';d.appendChild(s);} });
// details
const to=new URLSearchParams(location.search).get('to'); if(to){$('#dear').textContent='प्रिय '+to; $('#rsvpName').value=to;}
$('#darshan').innerHTML=C.darshan.map(n=>`<span>${n}</span>`).join(' · ')+'<br>एवं समस्त मनराल परिवार';
const q=encodeURIComponent(C.venueQuery);
$('#dirBtn').href=`https://www.google.com/maps/search/?api=1&query=${q}`;
const st=new Date(C.weddingISO),en=new Date(st.getTime()+6*36e5),fm=d=>d.toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
$('#calBtn').href=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent('Wedding of Aarti & Rakesh')}&dates=${fm(st)}/${fm(en)}&location=${q}&details=${encodeURIComponent('Baraat Swagat 7:00 PM, Shree Mohan Garden')}`;
$('#rsvp').addEventListener('submit',e=>{e.preventDefault();const d=new FormData(e.target);
 const m=`🙏 RSVP – Aarti & Rakesh (27 Nov 2026)\nName: ${d.get('name')}\nAttending: ${d.get('att')}\nGuests: ${d.get('n')}`;
 window.open(`https://wa.me/${C.rsvpWhatsApp||''}?text=${encodeURIComponent(m)}`,'_blank');});

/* petals: soft bougainvillea + marigold, slow */
function petals(){ const cols=['#E07A90','#D9536F','#F2A33A','#F7C26B'];
  for(let i=0;i<12;i++){const p=document.createElement('div');p.className='petal';const s=7+Math.random()*7;
   p.style.cssText=`left:${Math.random()*100}vw;width:${s}px;height:${s*.7}px;background:${cols[i%4]};animation-duration:${11+Math.random()*9}s;animation-delay:${-Math.random()*16}s`;
   p.style.setProperty('--dx',(Math.random()*160-80)+'px');p.style.setProperty('--r',(Math.random()*540)+'deg');document.body.appendChild(p);} }

/* music */
const audio=new Audio('assets/audio/shehnai.mp3'); audio.loop=true; audio.volume=0; const mb=$('#music');
const fade=(v,d=2)=>window.gsap?gsap.to(audio,{volume:v,duration:d}):audio.volume=v;
mb.onclick=()=>{ if(audio.paused){audio.play();fade(.5);mb.classList.add('on');} else {fade(0,.5);setTimeout(()=>audio.pause(),520);mb.classList.remove('on');} };

/* ===================== MOTION (slow, graceful) ===================== */
const G=!!window.gsap; let lenis=null;
if(G) gsap.registerPlugin(ScrollTrigger);
if(window.Lenis){ lenis=new Lenis({duration:1.35,easing:t=>1-Math.pow(1-t,3)}); lenis.stop(); if(G){lenis.on('scroll',ScrollTrigger.update);gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0);} }
const soft='power2.out';
const words=root=>[...root.querySelectorAll('.w2, .w:not(:has(.w2))')];
function bloom(card,delay=0){ const art=card.querySelector('.art'); const tl=gsap.timeline({delay});
  if(art){ tl.fromTo(art,{'--b':'-35%',filter:'blur(8px) saturate(.55)',scale:1.06},{'--b':'125%',filter:'blur(0px) saturate(1)',scale:1,duration:2.2,ease:'power2.inOut'}); }
  card.querySelectorAll('.w').forEach(w=>{ if(!w.querySelector('.w2')) gsap.set(w,{opacity:1,y:0,filter:'blur(0px)'}); else gsap.set(w,{opacity:1,y:0,filter:'none'}); });
  const ws=card.querySelectorAll('.w2, .w:not(:has(.w2))');
  gsap.set(card.querySelectorAll('.w2'),{opacity:0,y:14,filter:'blur(6px)'});
  tl.fromTo([...ws].filter(x=>!x.querySelector||!x.querySelector('.w2')),{opacity:0,y:14,filter:'blur(6px)'},{opacity:1,y:0,filter:'blur(0px)',duration:1.1,stagger:.07,ease:soft}, art?1.0:.15);
  return tl; }

if(G){
  gsap.from('#gate .gtop > *',{opacity:0,y:16,filter:'blur(6px)',duration:1.2,stagger:.15,ease:soft,delay:.2});
  gsap.from('#env',{y:30,opacity:0,duration:1.4,ease:soft,delay:.5});
  gsap.to('#seal',{scale:1.06,duration:1.4,yoyo:true,repeat:-1,ease:'sine.inOut',delay:1.8});
}
let opened=false;
function openGate(){ if(opened) return; opened=true;
  audio.play().then(()=>{fade(.5,3);mb.classList.add('on');}).catch(()=>{}); mb.style.display='flex';
  const first=$('.pg .card');
  const done=()=>{$('#gate').remove();document.body.classList.remove('lock');lenis&&lenis.start();ScrollTrigger.refresh();petals();};
  if(!G){ done(); return; }
  gsap.set(first.querySelector('.art'),{'--b':'-35%'});
  gsap.timeline({onComplete:done})
   .to('#gate .tap',{opacity:0,duration:.3})
   .to('#seal',{scale:1.35,opacity:0,duration:.6,ease:'power2.in'},'<')
   .to('#flap',{rotateX:180,duration:1.0,ease:'power2.inOut'},'-=.2')
   .set('#flap',{zIndex:0})
   .to('#letter',{yPercent:-62,duration:1.1,ease:'power3.out'},'-=.25')
   .to('#gate .gtop',{opacity:0,y:-20,duration:.6},'<')
   .to('#letter',{scale:2.6,yPercent:-30,opacity:0,duration:1.0,ease:'power2.in'},'+=.25')
   .to('#gate',{opacity:0,duration:.8,ease:'none'},'-=.5')
   .add(()=>bloom(first),'-=.6');
}
$('#env').addEventListener('click',openGate);

if(G){
  const pgs=$$('#book .pg');
  pgs.forEach((pg,i)=>{
    const card=pg.querySelector('.card');
    // hide text until the page arrives
    gsap.set(card.querySelectorAll('.w2, .w:not(:has(.w2))'),{opacity:0,y:14,filter:'blur(6px)'});
    if(i>0){ gsap.set(card.querySelector('.art')||{},{'--b':'-35%'});
      ScrollTrigger.create({trigger:pg,start:'top 70%',once:true,onEnter:()=>bloom(card)}); }
    if(i<pgs.length-1){
      // the page stays put while the next one slides over it, gently receding
      ScrollTrigger.create({trigger:pg,start:'top top',end:()=>'+='+innerHeight,pin:true,pinSpacing:false,invalidateOnRefresh:true});
      gsap.to(card,{scale:.93,filter:'brightness(.82)',ease:'none',scrollTrigger:{trigger:pg,start:'top top',end:()=>'+='+innerHeight,scrub:true,invalidateOnRefresh:true}});
    }
    const art=card.querySelector('.art');
    if(art) gsap.fromTo(art,{yPercent:0},{yPercent:-2.5,ease:'none',scrollTrigger:{trigger:pg,start:'top bottom',end:()=>'+='+innerHeight*2,scrub:true}});
  });
  // date reveal
  const reveal=()=>{ $$('.tile').forEach((t,i)=>setTimeout(()=>t.classList.add('on'),i*260)); const b=$('#reveal'); if(b) gsap.to(b,{opacity:0,duration:.5,onComplete:()=>b.style.visibility='hidden'}); };
  $('#reveal').addEventListener('click',reveal);
  ScrollTrigger.create({trigger:'#tiles',start:'top 20%',once:true,onEnter:reveal});
} else { $$('.w2,.w').forEach(e=>{e.style.opacity=1;e.style.transform='none';e.style.filter='none'}); $('#reveal').onclick=()=>$$('.tile').forEach(t=>t.classList.add('on')); }
</script>
</body>
</html>
